    <!--<script src="https://cdn.tailwindcss.com/3.4.16"></script>-->
    <link href="static/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Rounded:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <style>
        body {
            /* UPDATED: Changed font to Nunito to match logo */
            font-family: 'Open Sans', sans-serif;
            background-color: #f8fafc; /* Slate 50 */
            overflow-x: hidden; /* Prevents scrollbar from side panel */
        }
        .tag-pill {
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag-pill:hover:not(.tag-selected) {
            background-color: #f1f5f9; /* Slate 100 */
        }
        /* UPDATED: Changed from indigo-600 to teal-600 */
        .tag-selected {
            background-color: #0d9488; /* teal-600 */
            color: white;
            font-weight: 600;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        /* Custom styles for side panel filter pills */
        .filter-pill {
            cursor: pointer;
            transition: all 0.2s;
            border-color: #cbd5e1; /* Gray 300 */
            background-color: #f8fafc; /* Slate 50 */
            color: #475569; /* Slate 600 */
        }
        .filter-pill:hover {
            background-color: #f1f5f9; /* Slate 100 */
        }
        /* UPDATED: Changed from indigo-600 to teal-600 */
        .filter-pill-selected {
            background-color: #0d9488; /* teal-600 */
            color: white;
            border-color: #0d9488; /* teal-600 */
            font-weight: 500;
        }

        .filter-pill.filter-pill-selected:hover {
          border-color: #CCFBF1;     /* teal-600 */
          background-color: #CCFBF1; /* equivalent to bg-teal-100 */
          color: #0F766E;           /* equivalent to text-teal-700 */
        }

        /* New styles for accordion */
        .category-accordion-header {
            transition: background-color 0.2s;
        }
        .category-accordion-header:hover {
            background-color: #f8fafc; /* Slate 50 */
        }
        .accordion-icon {
            transition: transform 0.2s;
        }
        .accordion-open .accordion-icon {
            transform: rotate(90deg);
        }

        /* NEW: Styles for Note Modal */
        #modal-note-content {
            max-height: 60vh;
            overflow-y: auto;
            /* Respect line breaks from the email body */
            white-space: pre-line;
        }

        /* --- NEW: Styles for Broken Links --- */
        .broken-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ef4444; /* red-500 */
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 9999px;
            z-index: 10; /* Ensures it's on top of the image */
        }
        /* Style for the card itself when broken */
        .card-broken {
            opacity: 0.7;
            /* Add a dashed border to make it obvious */
            border: 1px dashed #ef4444;
        }
        .card-broken:hover {
            opacity: 1.0; /* Make it easy to read on hover */
        }

    </style>
</head>

    <div id="app" class="p-4 sm:p-8 transition-all duration-300">

        <header class="mb-8">
            <div class="flex items-center space-x-4">
              <img src="static/imgs/myndscribe-logo-icon-v4.png" alt="Myndscribe Icon" class="w-20 h-20 flex-shrink-0">

              <div>
                  <h1 class="text-4xl font-bold text-slate-800 tracking-tight">Myndscribe</h1>
                  <p class="text-gray-500">Sourced from your personal email archives and analyzed by Gemini.</p>
              </div>

          </div>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-lg mb-8 sticky top-0 z-10 border border-gray-100">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

                <input type="text" id="search-input" placeholder="Search by title, description, note, or tag..."
                       class="w-full md:w-1/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition duration-150">

                <div class="flex items-center space-x-4">
                    <button id="clear-tags-main" onclick="clearSidePanelFilters()"

    <script src="static/js/data.js"></script>
    <script src="static/js/settings.js"></script>

    <script>
        // === Data & State ===
        let allLinks = [];
        let isGridView = true; // State for view mode
        let currentFilteredLinks = []; // To hold the currently filtered list for the modal

        // --- Pagination State ---
        const LINKS_PER_PAGE_CHUNK = 50; // How many links to load at a time
        let visibleLinkCount = LINKS_PER_PAGE_CHUNK;

        // --- Filter State ---
        let selectedFilterTags = new Set();
        let isFilterExclusive = false; // false = OR (Inclusive), true = AND (Exclusive)
        let showBrokenLinksOnly = false; // NEW: State for broken links filter
        let groupedCategories = {}; // Will be populated from CATEGORY_MAP
        let tagCounts = {}; // To store counts for each tag
        let categoryOpenState = {}; // To store open/closed state of accordions

        const CATEGORY_MAP = tags_settings.categories;

        // --- Debounce Helper Function ---
        function debounce(func, delay) {
            let timer;
            return function(...args) {
                const context = this;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    func.apply(context, args);
                }, delay);
            };
        }

        // --- Helper to reset pagination ---
        function resetPaginationCount() {
            visibleLinkCount = LINKS_PER_PAGE_CHUNK;
        }

        // --- Main Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Setup debounced search input
            const searchInput = document.getElementById('search-input');
            const debouncedFilter = debounce(() => {
                resetPaginationCount(); // Reset count on a new search
                filterCards();
            }, 300);
            searchInput.addEventListener('input', debouncedFilter);

            // Initialize side panel logic
            initSidePanel();

            // Invert the category map for display
            invertCategoryMap();

            // Load card data
            loadData();

            // --- Add Modal Event Listeners ---
            document.getElementById('modal-overlay').addEventListener('click', closeNoteModal);
            document.getElementById('modal-close-btn').addEventListener('click', closeNoteModal);
        });

        // --- Side Panel Logic ---
        function initSidePanel() {
            const panelContainer = document.getElementById('side-panel-container');
            const toggleBtn = document.getElementById('toggle-btn');
            const closeBtnInside = document.getElementById('close-btn-inside');
            const openIcon = document.getElementById('open-icon');
            const closeIcon = document.getElementById('close-icon');

            let isOpen = false;

            function openPanel() {
                panelContainer.classList.remove('translate-x-full');
                panelContainer.classList.add('translate-x-0');
                openIcon.classList.add('hidden');
                closeIcon.classList.remove('hidden');
                isOpen = true;
            }

            function closePanel() {
                panelContainer.classList.add('translate-x-full');
                panelContainer.classList.remove('translate-x-0');
                openIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
                isOpen = false;
            }

            function togglePanel() {
                if (isOpen) {
                    closePanel();
                } else {
                    openPanel();
                }
            }

            toggleBtn.addEventListener('click', togglePanel);
            closeBtnInside.addEventListener('click', closePanel);

            document.getElementById('clear-side-panel-filters').addEventListener('click', clearSidePanelFilters);
        }

        // --- NEW: Function to toggle the broken links filter ---
        function toggleBrokenLinksFilter() {
            resetPaginationCount();
            showBrokenLinksOnly = !showBrokenLinksOnly;
            renderSidePanelFilters(); // Re-render panel to update button state
            filterCards(); // Re-apply all filters
        }

        // --- Data Loading ---
        function loadData() {
            if (typeof data !== 'undefined' && Array.isArray(data)) {
                allLinks = data;

                allLinks.sort((a, b) => {
                    const dateA = a.date_sent || 0;
                    const dateB = b.date_sent || 0;
                    return Number(dateB) - Number(dateA);
                });

                calculateTagCounts();
                applyStateFromURL();
                syncViewUI();
                renderSidePanelFilters();
                filterCards();
            } else {
                console.error("Error: 'data' variable not found or is not an array. Ensure data.js is loaded correctly.");
                document.getElementById('cards-container').innerHTML = '';
                document.getElementById('status-message').classList.remove('hidden');
                document.getElementById('status-message').innerHTML = `
                    <h3 class="mt-2 text-sm font-medium text-red-700">Data Load Error</h3>
                    <p class="mt-1 text-sm text-red-500">The 'data.js' file could not be loaded or is formatted incorrectly.</p>
                `;
                document.getElementById('results-count').textContent = 'Error';
            }
        }

        // --- URL State Management ---
        function applyStateFromURL() {
            const params = new URLSearchParams(window.location.search);
            const urlSearch = params.get('search');
            const urlTags = params.get('tags');
            const urlView = params.get('view');
            const urlMode = params.get('mode');

            if (urlSearch) {
                document.getElementById('search-input').value = urlSearch;
            }

            if (urlTags) {
                urlTags.split(',').forEach(tag => {
                    if (tag.trim()) {
                        selectedFilterTags.add(tag.trim());
                    }
                });
            }

            if (urlView === 'list') {
                isGridView = false;
            }

            if (urlMode === 'and') {
                isFilterExclusive = true;
            }
        }

        function updateURLState() {
            const query = document.getElementById('search-input').value;
            const tags = Array.from(selectedFilterTags).join(',');
            const params = new URLSearchParams();

            if (query) params.set('search', query);
            if (tags) params.set('tags', tags);
            if (!isGridView) params.set('view', 'list');
            if (isFilterExclusive) params.set('mode', 'and');

            const queryString = params.toString();
            const newUrl = queryString
                ? `${window.location.pathname}?${queryString}`
                : window.location.pathname;

            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        // --- New Filter System Logic ---
        function calculateTagCounts() {
            tagCounts = {};
            allLinks.forEach(link => {
                const analysis = link.analysis || {};
                const tags = analysis.tags || [];
                const uniqueTagsForLink = new Set(tags.map(t => t.toLowerCase()));
                uniqueTagsForLink.forEach(tag => {
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
            });
        }

        function invertCategoryMap() {
            groupedCategories = {};
            for (const tag in CATEGORY_MAP) {
                const categories = CATEGORY_MAP[tag];
                for (const category of categories) {
                    if (!groupedCategories[category]) {
                        groupedCategories[category] = [];
                    }
                    if (!groupedCategories[category].includes(tag)) {
                         groupedCategories[category].push(tag);
                    }
                }
            }
            for (const category in groupedCategories) {
                groupedCategories[category].sort();
            }
        }

        function renderSidePanelFilters() {
            const container = document.getElementById('side-panel-content');
            const modeButtonText = isFilterExclusive ? 'Mode: Exclusive (AND)' : 'Mode: Inclusive (OR)';
            const modeButtonBg = isFilterExclusive ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700';
            const modeExplanation = isFilterExclusive ? 'Showing items that match <strong>ALL</strong> selected tags.' : 'Showing items that match <strong>ANY</strong> selected tag.';

            let html = `
                <div class="p-4 border-b">
                    <button
                        id="filter-mode-toggle"
                        onclick="toggleFilterMode()"
                        class="w-full text-center px-3 py-2 text-sm font-medium rounded-lg ${modeButtonBg} transition-colors">
                        ${modeButtonText}
                    </button>
                    <p class="text-xs text-gray-500 mt-2 text-center">${modeExplanation}</p>
                </div>
            `;

            // --- NEW: Add Broken Links Filter Section ---
            const brokenButtonBg = showBrokenLinksOnly ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700';
            const brokenButtonText = showBrokenLinksOnly ? 'Showing Only Broken Links' : 'Filter by Broken Links';
            html += `
                <div class="p-4 border-b">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Special Filters</h3>
                    <button
                        id="broken-links-toggle"
                        onclick="toggleBrokenLinksFilter()"
                        class="w-full text-center px-3 py-2 text-sm font-medium rounded-lg ${brokenButtonBg} transition-colors">
                        ${brokenButtonText}
                    </button>
                    <p class="text-xs text-gray-500 mt-2 text-center">
                        ${showBrokenLinksOnly ? 'Only showing links marked as "broken" or "timeout".' : 'Click to show only broken links.'}
                    </p>
                </div>
            `;
            // --- END: New Section ---

            const sortedCategories = Object.keys(groupedCategories).sort();
            for (const category of sortedCategories) {
                const isOpen = categoryOpenState[category] || false;
                const pillCount = groupedCategories[category].length;
                let totalEntries = 0;
                groupedCategories[category].forEach(tag => {
                    totalEntries += (tagCounts[tag.toLowerCase()] || 0);
                });

                const tagsInCategory = groupedCategories[category];
                const areAllSelected = tagsInCategory.every(tag => selectedFilterTags.has(tag));
                const buttonText = areAllSelected ? 'Deselect All' : 'Select All';
                const onClickFunction = areAllSelected ? 'deselectAllTagsInCategory' : 'selectAllTagsInCategory';
                const buttonClass = areAllSelected ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-teal-100 text-teal-800 hover:bg-teal-200';
                const selectAllButtonHtml = `
                    <div class="mb-3">
                        <button
                            onclick="${onClickFunction}('${category}')"
                            class="w-full text-xs font-medium px-2 py-1.5 rounded-md transition-colors ${buttonClass}">
                            ${buttonText} (${tagsInCategory.length})
                        </button>
                    </div>
                `;

                html += `
                    <div class="border-b">
                        <button
                            class="category-accordion-header w-full flex justify-between items-center p-4 text-left ${isOpen ? 'accordion-open' : ''}"
                            onclick="toggleCategory('${category}')">
                            <div>
                                <span class="text-sm font-semibold text-gray-800">${category}</span>
                                <span class="block text-xs text-gray-500">${pillCount} pills, ${totalEntries} entries</span>
                            </div>
                            <svg class="accordion-icon w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        <div class="p-4 border-t bg-gray-50/50 ${isOpen ? '' : 'hidden'}">
                            ${selectAllButtonHtml}
                            <div class="flex flex-wrap gap-2">
                `;

                for (const tag of groupedCategories[category]) {
                    const isSelected = selectedFilterTags.has(tag);
                    const selectedClass = isSelected ? 'filter-pill-selected' : '';
                    const count = tagCounts[tag.toLowerCase()] || 0;
                    html += `
                        <span
                            class="filter-pill text-xs font-medium px-2.5 py-1 rounded-full border ${selectedClass}"
                            onclick="toggleSidePanelTag('${tag}')">
                            ${tag} (${count})
                        </span>`;
                }
                html += `</div></div></div>`;
            }
            container.innerHTML = html;
        }

        function toggleCategory(category) {
            categoryOpenState[category] = !categoryOpenState[category];
            renderSidePanelFilters();
        }

        function toggleFilterMode() {
            resetPaginationCount();
            isFilterExclusive = !isFilterExclusive;
            renderSidePanelFilters();
            filterCards();
        }

        function toggleSidePanelTag(tag) {
            resetPaginationCount();
            if (selectedFilterTags.has(tag)) {
                selectedFilterTags.delete(tag);
            } else {
                selectedFilterTags.add(tag);
            }
            const currentScroll = document.getElementById('side-panel-content').scrollTop;
            renderSidePanelFilters();
            document.getElementById('side-panel-content').scrollTop = currentScroll;
            filterCards();
        }

        function clearSidePanelFilters() {
            resetPaginationCount();
            selectedFilterTags.clear();
            document.getElementById('search-input').value = '';
            showBrokenLinksOnly = false; // --- NEW: Reset broken links filter ---
            renderSidePanelFilters();
            filterCards();
            renderSelectedPills();
        }

        function selectAllTagsInCategory(category) {
            resetPaginationCount();
            const tags = groupedCategories[category];
            if (!tags) return;
            const currentScroll = document.getElementById('side-panel-content').scrollTop;
            tags.forEach(tag => selectedFilterTags.add(tag));
            renderSidePanelFilters();
            document.getElementById('side-panel-content').scrollTop = currentScroll;
            filterCards();
        }

        function deselectAllTagsInCategory(category) {
            resetPaginationCount();
            const tags = groupedCategories[category];
            if (!tags) return;
            const currentScroll = document.getElementById('side-panel-content').scrollTop;
            tags.forEach(tag => selectedFilterTags.delete(tag));
            renderSidePanelFilters();
            document.getElementById('side-panel-content').scrollTop = currentScroll;
            filterCards();
        }

        function renderSelectedPills() {
            const container = document.getElementById('selected-pills-container');
            container.innerHTML = '';

            if (selectedFilterTags.size === 0) {
                 container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');

            selectedFilterTags.forEach(tag => {
                const pill = document.createElement('span');
                pill.className = "filter-pill-selected text-xs font-medium px-2.5 py-1 rounded-full border flex items-center gap-1.5";
                pill.innerHTML = `
                    ${tag}
                    <svg onclick="removeTagFromPill('${tag}')" class="w-3.5 h-3.5 cursor-pointer text-white/70 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                `;
                container.appendChild(pill);
            });
        }

        function removeTagFromPill(tag) {
            resetPaginationCount();
            if (selectedFilterTags.has(tag)) {
                selectedFilterTags.delete(tag);
                filterCards();
                renderSidePanelFilters();
                renderSelectedPills();
            }
        }

        // --- View Logic ---
        function syncViewUI() {
            const container = document.getElementById('cards-container');
            const viewText = document.getElementById('view-text');
            const gridIcon = document.getElementById('grid-icon');
            const listIcon = document.getElementById('list-icon');

            if (isGridView) {
                container.className = "grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-6 2xl:grid-cols-6 gap-4";
                viewText.textContent = 'List View';
                gridIcon.classList.remove('hidden');
                listIcon.classList.add('hidden');
            } else {
                container.className = "flex flex-col gap-4";
                viewText.textContent = 'Grid View';
                gridIcon.classList.add('hidden');
                listIcon.classList.remove('hidden');
            }
        }

        function toggleView() {
            resetPaginationCount();
            isGridView = !isGridView;
            syncViewUI();
            filterCards();
        }

        // --- Core Filtering & Rendering ---
        function filterCards() {
            const query = document.getElementById('search-input').value.toLowerCase();

            const filteredLinks = allLinks.filter(link => {
                const analysis = link.analysis || {};
                const title = (analysis.title || '').toLowerCase();
                const description = (analysis.short_description || '').toLowerCase();
                const allTags = (analysis.tags || []).map(t => t.toLowerCase());
                const linkTagsSet = new Set(allTags);

                const subject = (link.email_subject || '').toLowerCase();
                const note = (link.email_note || '').toLowerCase();

                // 1. Search Query Filter
                const passesSearch = !query ||
                                     title.includes(query) ||
                                     description.includes(query) ||
                                     allTags.some(tag => tag.includes(query)) ||
                                     subject.includes(query) ||
                                     note.includes(query);

                // 2. Tag Filter
                let passesTags = true;
                if (selectedFilterTags.size > 0) {
                    if (isFilterExclusive) {
                        passesTags = Array.from(selectedFilterTags).every(tag => linkTagsSet.has(tag.toLowerCase()));
                    } else {
                        passesTags = Array.from(selectedFilterTags).some(tag => linkTagsSet.has(tag.toLowerCase()));
                    }
                }

                // 3. NEW: Broken Link Filter
                let passesBrokenLinkFilter = true; // Default to true
                if (showBrokenLinksOnly) {
                    passesBrokenLinkFilter = (link.link_status === 'broken' || link.link_status === 'timeout');
                }

                return passesSearch && passesTags && passesBrokenLinkFilter;
            });

            currentFilteredLinks = filteredLinks; // Store for the modal
            renderCards(filteredLinks); // Pass filtered links to render
            renderSelectedPills();
            updateURLState();
        }

        // --- Load More Function ---
        function loadMoreLinks() {
            visibleLinkCount += LINKS_PER_PAGE_CHUNK;
            filterCards(); // Re-filter and re-render
        }

        // --- Modal Functions ---
        function openNoteModal(index) {
            const link = currentFilteredLinks[index];
            if (!link) return;

            const subject = link.email_subject || 'No Subject';
            const note = link.email_note || 'No note available for this email.';

            document.getElementById('modal-subject').textContent = subject;
            document.getElementById('modal-note-content').textContent = note; // Using .textContent respects pre-line whitespace

            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
        }

// MODIFIED: This function is now pagination-aware
function renderCards(links) {
    const container = document.getElementById('cards-container');
    const statusMessage = document.getElementById('status-message');
    const resultsCount = document.getElementById('results-count');
    const loadMoreContainer = document.getElementById('load-more-container');

    loadMoreContainer.innerHTML = '';

    // Only clear the container if it's the first page
    if (visibleLinkCount === LINKS_PER_PAGE_CHUNK) {
        container.innerHTML = '';
    }

    const totalLinks = links.length;

    if (totalLinks === 0) {
        container.innerHTML = ''; // Ensure container is clear
        statusMessage.classList.remove('hidden');
        container.classList.add('hidden');
        resultsCount.textContent = `Showing 0 of ${allLinks.length} results`;
        return;
    }

    statusMessage.classList.add('hidden');
    container.classList.remove('hidden');

    // Get the slice of links to show
    const linksToShow = links.slice(0, visibleLinkCount);

    // Update results count text
    resultsCount.textContent = `Showing ${linksToShow.length} of ${totalLinks} results (from ${allLinks.length} total links)`;

    // --- SVG Icons for metadata ---
    const iconAuthor = `<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`;
    const iconDate = `<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`;
    const iconSource = `<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>`;
    const iconScore = `<svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
    const iconId = `<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m4 16l-4-16M6 9h12M6 15h12"></path></svg>`;
    const iconSentDate = `<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`;
    // --- NEW: Note Icon ---
    const iconNote = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;


    // We *always* clear and re-render the *entire visible slice*.
    // This is the simplest, most robust way to handle pagination.
    container.innerHTML = '';

    linksToShow.forEach((link, index) => {
        // --- Extract data ---
        const analysis = link.analysis || {};
        const emailID = link.email_id || '-';
        const tags = analysis.tags || [];
        const linkTitle = analysis.title || 'Untitled Link';
        const linkDescription = analysis.short_description || 'No description available.';
        const author = analysis.author || 'Unknown';
        const source = analysis.source_platform || 'Unknown';

        // --- MODIFIED: Check link status ---
        const isBroken = (link.link_status === 'broken' || link.link_status === 'timeout');

        const rawUrl = analysis.thumbnail_url;
        const placeholder = 'https://placehold.co/400x260/e2e8f0/94a3b8?text=No+Preview';
        const isValidUrl = rawUrl && (rawUrl.startsWith('http') || rawUrl.startsWith('data:'));
        const imageUrl = isValidUrl ? rawUrl : placeholder;

        const pubDateRaw = analysis.publication_date;
        const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString() : 'N/A';

        const sentDateRaw = link.date_sent;
        const sentDate = sentDateRaw ? new Date(Number(sentDateRaw)).toLocaleDateString() : 'N/A';

        const score = analysis.engagement_score !== undefined ? analysis.engagement_score.toFixed(1) : 'N/A';

        const tagPills = tags
            .filter(tag => typeof tag === 'string')
            .map(tag =>
                `<span class="text-[10px] font-medium px-2 py-0.5 rounded-full text-teal-700 bg-teal-100">${tag}</span>`
            ).join('');

        const tagContainerHtml = `
            <div class="flex flex-wrap gap-1 mb-1">
                ${tagPills}
            </div>
        `;

        const metadataIconsHtml = `
            <span class="flex items-center" title="Author: ${author}">
                ${iconAuthor}
                <span class="truncate ml-0.5" style="max-width: 80px;">${author}</span>
            </span>
            <span class="flex items-center" title="Sent Date: ${sentDate}">
                ${iconSentDate}
                <span class="ml-0.5">${sentDate}</span>
            </span>
            <span class="flex items-center" title="Source: ${source}">
                ${iconSource}
                <span class="truncate ml-0.5" style="max-width: 80px;">${source}</span>
            </span>
            <span class="flex items-center" title="Pub. Date: ${pubDate}"> ${iconDate}
                <span class="ml-0.5">${pubDate}</span>
            </span>
            <span class="flex items-center" title="ID: ${emailID}">
                ${iconId}
                <span class="ml-0.5">${emailID}</span>
            </span>
            <span class="flex items-center font-medium text-gray-600" title="Engagement Score: ${score}">
                ${iconScore}
                <span class="ml-0.5">${score}</span>
            </span>
        `;

        // --- MODIFIED: Added View Note Button ---
        const visitLinkHtml = `
            <a href="${link.url}" target="_blank" class="text-teal-600 hover:text-teal-800 font-semibold text-xs transition duration-150 flex items-center">
                Link
                <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        `;

        // NEW: View Note Button
        // The 'index' here is the correct index in currentFilteredLinks
        const viewNoteHtml = `
            <button onclick="openNoteModal(${index})" title="View Email Note" class="text-gray-400 hover:text-gray-600 font-semibold text-xs transition duration-150 flex items-center">
                ${iconNote}
            </button>
        `;

        // --- MODIFIED: Footer now has a flex container for the buttons ---
        const footerHtml = `
          <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between items-start">
              <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-gray-500">
                  ${metadataIconsHtml}
              </div>

              <div class="flex flex-col h-full justify-between">
                  <div class="flex justify-end mb-1">
                      ${viewNoteHtml}
                  </div>

                  <div class="flex justify-end mt-1">
                      ${visitLinkHtml}
                  </div>
              </div>
          </div>
        `;

        let cardHtml;
        let cardClasses;

        if (isGridView) {
            // MODIFIED: Added ${isBroken ? 'card-broken' : ''} and relative positioning
            cardClasses = `bg-white rounded-xl shadow-lg hover:shadow-xl transition duration-300 overflow-hidden flex flex-col relative ${isBroken ? 'card-broken' : ''}`;
            cardHtml = `
                ${isBroken ? '<span class="broken-badge">BROKEN</span>' : ''}

                <img src="${imageUrl}" onerror="this.onerror=null;this.src='https://placehold.co/400x260/e2e8f0/94a3b8?text=No+Preview';"
                    class="w-full h-32 object-cover object-center" alt="Thumbnail for ${linkTitle}">

                <div class="p-3 flex flex-col flex-grow">
                    <div class="flex-grow">
                        <h3 class="text-base font-bold text-gray-800 mb-0.5 truncate" title="${linkTitle}">${linkTitle}</h3>

                        <p class="text-gray-600 text-xs mb-2 line-clamp-4">${linkDescription}</p>
                    </div>

                    ${tagContainerHtml}

                    ${footerHtml}
                </div>
            `;
        } else {
            // MODIFIED: Added ${isBroken ? 'card-broken' : ''} and relative positioning
            cardClasses = `bg-white rounded-xl shadow-md hover:shadow-lg transition duration-300 p-3 border border-gray-100 flex items-start space-x-2 relative ${isBroken ? 'card-broken' : ''}`;
            cardHtml = `
                ${isBroken ? '<span class="broken-badge">BROKEN</span>' : ''}

                <img src="${imageUrl}" onerror="this.onerror=null;this.src='https://placehold.co/64x64/e2e8f0/94a3b8?text=P';"
                    class="flex-shrink-0 w-10 h-10 object-cover rounded-md" alt="Thumbnail for ${linkTitle}">

                <div class="flex-grow min-w-0 flex flex-col">
                    <div class="flex-grow">
                        <h3 class="text-sm font-bold text-gray-800" title="${linkTitle}">
                            <a href="${link.url}" target="_blank" class="hover:text-teal-600 truncate block">${linkTitle}</a>
                        </h3>

                        <p class="text-gray-500 text-xs mt-0.5 line-clamp-1">${linkDescription}</p>
                    </div>

                    ${tagContainerHtml}

                    ${footerHtml}
                </div>
            `;
        }

        const cardElement = document.createElement('div');
        cardElement.className = cardClasses;
        cardElement.innerHTML = cardHtml;
        container.appendChild(cardElement);
    });

    // --- NEW: Add "Load More" button if needed ---
    if (totalLinks > visibleLinkCount) {
        loadMoreContainer.innerHTML = `
            <button
                onclick="loadMoreLinks()"
                class="px-6 py-3 bg-teal-500 text-white font-medium rounded-lg shadow-md hover:bg-teal-600 transition duration-150">
                Load More (${totalLinks - visibleLinkCount} remaining)
            </button>
        `;
    }
}
    </script>
